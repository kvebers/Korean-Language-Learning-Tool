<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Match · Hangul</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Sound Match <span class="ko">짝 맞추기</span></h1>
  </header>

  <main class="wrap">
    <div id="settings" class="settings"></div>
    <div id="notice"></div>
    <div class="hud">
      <span>Mistakes <b id="mistakes">0</b></span>
      <span>Pairs <b id="pairs">0 / 0</b></span>
      <span>Time <b id="time">0:00</b></span>
      <span class="spacer"></span>
      <button class="btn" id="restart">New game</button>
    </div>
    <p class="muted hint">Tap a sound to hear it, then tap the matching letter (or the other way round).</p>

    <div class="columns">
      <section>
        <h2 class="col-title">Sounds 🔊</h2>
        <div id="sounds" class="cards"></div>
      </section>
      <section>
        <h2 class="col-title">Letters <span class="ko">글자</span></h2>
        <div id="letters" class="cards"></div>
      </section>
    </div>

    <div id="summary" hidden></div>
  </main>

  <script src="../../shared/config.js"></script>
  <script src="../../shared/hangul.js"></script>
  <script src="../../shared/sound.js"></script>
  <script src="../../shared/progress.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
