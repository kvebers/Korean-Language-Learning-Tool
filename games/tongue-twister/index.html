<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tongue Twisters · Korean</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Tongue Twisters <span class="ko">잰말놀이</span></h1>
  </header>

  <main class="wrap">
    <div id="settings" class="settings"></div>
    <div id="notice"></div>

    <section id="start" class="panel start">
      <p>Say the whole twister before the clock runs out. Speech recognition follows along and turns
        every syllable it didn't catch <b class="feedback-bad">red</b>. Then re-record just the
        problem words until they're clean to clear the stage.</p>
      <p id="mode-note" class="muted"></p>
      <button class="btn primary big" id="start-btn">Start</button>
    </section>

    <section id="play" class="panel" hidden>
      <div class="hud">
        <span>Stage <b id="stage">1 / 5</b></span>
        <span>Score <b id="score">0</b></span>
        <span class="spacer"></span>
        <span id="clock" class="clock"></span>
      </div>
      <div class="twister" id="twister"></div>
      <p class="muted center" id="english"></p>
      <div class="g-row">
        <button class="btn" id="hear">🔊 Hear it</button>
        <button class="btn" id="hear-slow">🐢 Slowly</button>
        <button class="btn primary mic" id="mic">🎤 Say it all</button>
      </div>
      <p id="heard" class="muted center"></p>
      <div id="problems" class="problems" hidden></div>
      <p id="feedback" class="g-feedback" aria-live="polite"></p>
      <div class="g-row">
        <button class="btn" id="self-ok" hidden>✓ I said it cleanly</button>
        <button class="btn" id="skip">Skip</button>
        <button class="btn primary" id="next" hidden>Next stage →</button>
      </div>
    </section>

    <div id="summary" hidden></div>
  </main>

  <script src="../../shared/config.js"></script>
  <script src="../../shared/hangul.js"></script>
  <script src="../../shared/sound.js"></script>
  <script src="../../shared/progress.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
