<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where Is It? · Korean</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Where Is It? <span class="ko">어디에 있어요?</span></h1>
  </header>

  <main class="wrap">
    <div id="settings" class="settings"></div>
    <div id="notice"></div>

    <section id="start" class="panel start">
      <p>Say where things are: <b>place + position + 에 있어요</b>.
        <span class="ko">고양이가 의자 <b>위</b>에 있어요</span> (the cat is on the chair).</p>
      <p class="ko positions">위 on/above · 아래 under · 앞 in front · 뒤 behind · 옆 next to · 안 inside</p>
      <p class="muted">Sometimes the question is “is there…?”: answer <span class="ko">네, 있어요</span> or <span class="ko">아니요, 없어요</span>.</p>
      <button class="btn primary big" id="start-btn">Start</button>
    </section>

    <section id="play" class="panel" hidden>
      <div class="hud">
        <span>Question <b id="qnum">1 / 10</b></span>
        <span>Score <b id="score">0</b></span>
        <span class="spacer"></span>
        <button class="btn" id="replay">🔊</button>
      </div>
      <p class="ask ko" id="ask"></p>
      <p class="muted center" id="ask-en"></p>
      <div id="scene" class="scene-wrap"></div>
      <div id="options" class="g-options"></div>
      <p id="feedback" class="g-feedback" aria-live="polite"></p>
      <div class="g-row"><button class="btn primary" id="next" hidden>Next →</button></div>
    </section>

    <div id="summary" hidden></div>
  </main>

  <script src="../../shared/config.js"></script>
  <script src="../../shared/hangul.js"></script>
  <script src="../../shared/korean.js"></script>
  <script src="../../shared/sound.js"></script>
  <script src="../../shared/progress.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
