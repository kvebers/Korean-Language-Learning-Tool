<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw the Letter · Hangul</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Draw the Letter <span class="ko">글자 쓰기</span></h1>
  </header>

  <main class="wrap">
    <div id="settings" class="settings"></div>
    <div id="notice"></div>

    <section id="start" class="panel start">
      <p>Hear or read a sound, then draw the Hangul letter in the box.
        <b>Enter</b> checks / continues, <b>Ctrl+Z</b> undoes a stroke, <b>Space</b> replays the sound.</p>
      <button class="btn primary big" id="start-btn">Start round</button>
    </section>

    <section id="play" class="panel" hidden>
      <div class="hud">
        <span>Letter <b id="qnum">1 / 10</b></span>
        <span>Score <b id="score">0</b></span>
      </div>

      <div class="prompt">
        <button class="btn" id="replay" title="Play again (Space)">🔊 Play sound</button>
        <div id="prompt-text" class="prompt-text"></div>
      </div>

      <div class="stage">
        <canvas id="pad" class="pad" aria-label="Drawing area"></canvas>
        <div id="answer" class="answer" hidden></div>
      </div>

      <div class="tools">
        <button class="btn" id="undo">↶ Undo</button>
        <button class="btn" id="clear">Clear</button>
        <button class="btn" id="hint">Show hint</button>
        <span class="spacer"></span>
        <button class="btn primary" id="check">Check</button>
      </div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <div id="after" class="tools after" hidden>
        <button class="btn" id="override" hidden>I drew it right, count it</button>
        <span class="spacer"></span>
        <button class="btn primary" id="next">Next →</button>
      </div>
    </section>

    <div id="summary" hidden></div>
  </main>

  <script src="../../shared/config.js"></script>
  <script src="../../shared/hangul.js"></script>
  <script src="../../shared/sound.js"></script>
  <script src="../../shared/progress.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="recognize.js"></script>
  <script src="game.js"></script>
</body>
</html>
