<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Match · Korean</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Word Match <span class="ko">단어 짝</span></h1>
  </header>

  <main class="wrap">
    <div id="settings" class="settings"></div>
    <div id="vocab-status"></div>
    <div id="notice"></div>

    <section id="start" class="panel start">
      <p id="mode-text"></p>
      <button class="btn primary big" id="start-btn">Start</button>
    </section>

    <section id="play" class="panel" hidden>
      <div class="hud">
        <span>Pairs <b id="pairs">0</b></span>
        <span>Mistakes <b id="mistakes">0</b></span>
        <span id="time-wrap">Time <b id="time">0:00</b></span>
        <span class="spacer"></span>
        <button class="btn" id="quit">End</button>
      </div>
      <div class="timebar" id="timebar" hidden><i id="timefill"></i></div>
      <div class="columns">
        <div class="cards" id="left"></div>
        <div class="cards" id="right"></div>
      </div>
    </section>

    <div id="summary" hidden></div>
  </main>

  <script src="../../shared/config.js"></script>
  <script src="../../shared/hangul.js"></script>
  <script src="../../shared/sound.js"></script>
  <script src="../../shared/progress.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="../../shared/words/a1.js"></script>
  <script src="../../shared/words/a2.js"></script>
  <script src="../../shared/words/b1.js"></script>
  <script src="../../shared/words/b2.js"></script>
  <script src="../../shared/vocab.js"></script>
  <script src="game.js"></script>
</body>
</html>
