<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Routine · Korean</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html">← All games</a>
    <h1>Daily Routine <span class="ko">하루 일과</span></h1>
  </header>

  <main class="wrap">
    <div id="settings" class="settings"></div>
    <div id="notice"></div>

    <section id="start" class="panel start">
      <p>Walk your piece through a whole day, from waking up to going to bed. Each step shows an action:
        pick the Korean verb that matches it to move forward. Then hear the whole sentence, like
        <span class="ko">일곱 시에 일어나요</span> (I get up at seven).</p>
      <button class="btn primary big" id="start-btn">Start the day</button>
    </section>

    <section id="play" class="panel" hidden>
      <div class="hud">
        <span>Step <b id="step">1 / 15</b></span>
        <span>Score <b id="score">0</b></span>
      </div>
      <div class="board" id="board"></div>
      <div class="scene">
        <div class="clock" id="clock"></div>
        <div class="action" id="action"></div>
        <div class="hint" id="hint"></div>
      </div>
      <div id="options" class="g-options"></div>
      <p id="feedback" class="g-feedback" aria-live="polite"></p>
      <div class="g-row"><button class="btn primary" id="next" hidden>Move on →</button></div>
    </section>

    <div id="summary" hidden></div>
  </main>

  <script src="../../shared/config.js"></script>
  <script src="../../shared/hangul.js"></script>
  <script src="../../shared/korean.js"></script>
  <script src="../../shared/sound.js"></script>
  <script src="../../shared/progress.js"></script>
  <script src="../../shared/ui.js"></script>
  <script src="../../shared/words/a1.js"></script>
  <script src="../../shared/words/a2.js"></script>
  <script src="../../shared/vocab.js"></script>
  <script src="game.js"></script>
</body>
</html>
